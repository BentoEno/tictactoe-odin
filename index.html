<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="header">
        <h1>Tic Tac Toe</h1>
        <p class="turn">Let's Start, Player o Go First!</p>
        <div class="button">
            <div class="nextRound">next round</div>
            <div class="restart">restart</div>
        </div>
    </div>
    <div class="container">
    </div>
    <div class="scoreboard">
            <div class="player1">
                <p class="name">Player O</p>
                <p class="score score1">0</p>
            </div>
            <div class="ties">
                <p class="name">TIES</p>
                <p class="score tie">0</p>
            </div>
            <div class="player2">
                <p class="name">Player X</p>
                <p class="score score2">0</p>
            </div>
            </div>
        </div>
</body>
</html>
